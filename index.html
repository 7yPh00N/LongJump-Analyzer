<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Long Jump Analyzer | Gain = MAX(i) - MAX(i-1)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1d, #03060c);
            font-family: 'Segoe UI', 'Inter', 'Poppins', 'Share Tech Mono', monospace;
            padding: 2rem 1.5rem;
            color: #e0f2fe;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(12, 20, 30, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1) inset;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .card-header {
            background: rgba(0, 20, 40, 0.8);
            padding: 1rem 2rem;
            border-bottom: 1px solid #0ff3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #aaffff, #4d9eff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 5px #0ff3;
        }

        .badge {
            background: #0ff1a;
            border: 1px solid #0ff;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }

        .compare-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .data-panel {
            flex: 1;
            min-width: 280px;
            background: rgba(8, 16, 26, 0.7);
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid #1e3a5f;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .data-panel:hover {
            border-color: #0ff6;
            box-shadow: 0 0 12px #0ff2;
        }

        .panel-a h3 { border-left-color: #3b82f6; color: #60a5fa; }
        .panel-b h3 { border-left-color: #f97316; color: #f97316; }

        .data-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            border-left: 3px solid;
            padding-left: 12px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .stats-mini {
            background: #0a0f1ad9;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid #2a4c7a;
        }

        .stats-mini span {
            color: #9ad7ff;
        }

        textarea {
            width: 100%;
            height: 240px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.45;
            background: #03060cee;
            color: #b0e0ff;
            border: 1px solid #2c5a7a;
            border-radius: 1rem;
            padding: 0.8rem;
            resize: vertical;
            white-space: pre;
            overflow-x: auto;
            transition: 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 8px #0ff4;
            background: #01050b;
        }

        .btn-group {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }

        .btn-sm {
            background: rgba(0, 30, 60, 0.8);
            border: 1px solid #2c6e9e;
            color: #bbf0ff;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }

        .btn-sm.primary {
            background: #0a5f8a;
            border-color: #0ff;
            color: white;
            text-shadow: 0 0 2px black;
        }

        .btn-sm:hover {
            background: #0ff2;
            border-color: #0ff;
            color: #0ff;
            transform: translateY(-1px);
        }

        .chart-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            padding: 0.5rem 1rem 1rem 1rem;
        }

        #compareChart {
            width: 100%;
            height: 100%;
            border-radius: 1.2rem;
            background: #03060c;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .stats-table-wrapper {
            overflow-x: auto;
            margin-top: 1rem;
            border-radius: 1rem;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            background: #0a101cee;
            border-radius: 1rem;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }

        .stats-table th {
            background: #0b2a44;
            padding: 0.5rem;
            text-align: center;
            color: #0ff;
            font-weight: 600;
            border-bottom: 1px solid #2e6a9e;
        }

        .stats-table td {
            padding: 0.4rem;
            text-align: center;
            border-bottom: 1px solid #1e3a5f;
            color: #cbe5ff;
        }

        .error-msg {
            background: #ff33662a;
            color: #ff9fae;
            border-left: 4px solid #f44;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            margin: 0.5rem 1.5rem;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
        }

        .option-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0.5rem 1.8rem 0 1.8rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .switch-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-family: monospace;
            color: #9ad7ff;
            cursor: pointer;
        }

        .switch-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0ff;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #5f8fbf;
            margin-top: 1.5rem;
            padding-bottom: 1rem;
            opacity: 0.7;
        }

        @media (max-width: 800px) {
            body { padding: 1rem; }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111a28;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #0ff4;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Long Jump</h2>
            <div class="badge"></div>
        </div>

        <div class="compare-layout">
            <div class="data-panel panel-a">
                <h3>🔷 Data 01</h3>
                <div id="statsA" class="stats-mini">⟳ Waiting for data</div>
                <textarea id="dataA" placeholder="Paste Strafe data here (multi-line support)..."></textarea>
                <div class="btn-group">
                    <button class="btn-sm" id="exampleA">◢ Load WR Data</button>
                    <button class="btn-sm primary" id="clearA">⌧ Clear</button>
                </div>
            </div>
            <div class="data-panel panel-b">
                <h3>🔶 Data 02</h3>
                <div id="statsB" class="stats-mini">⟳ No data (empty by default)</div>
                <textarea id="dataB" placeholder="Paste Strafe data here (optional)..."></textarea>
                <div class="btn-group">
                    <button class="btn-sm" id="exampleB">◢ Load Example B (optional)</button>
                    <button class="btn-sm primary" id="clearB">⌧ Clear</button>
                </div>
            </div>
        </div>

        <div class="option-bar">
            <label class="switch-label">
                <input type="checkbox" id="keyPointsOnlyCheckbox">
                <span>🔗 KEY POINTS ONLY (Frame 0 → MAX → Last Frame)</span>
            </label>
        </div>

        <div id="globalError" class="error-msg" style="display: none;"></div>

        <div class="chart-container">
            <div id="compareChart"></div>
        </div>

        <div style="padding: 0 1.5rem 1.5rem 1.5rem;">
            <div style="display: flex; flex-wrap: wrap; gap: 1.5rem;">
                <div style="flex:1; min-width: 260px;">
                    <div class="stats-title" style="color:#60a5fa; margin-bottom:0.5rem;">📡 Data 01 · PER-STRAFE</div>
                    <div class="stats-table-wrapper">
                        <table class="stats-table" id="tableA">
                            <thead><tr><th>STRAFE</th><th>FRAMES</th><th>START</th><th>MAX</th><th>END</th><th>GAIN</th></tr></thead>
                            <tbody><tr><td colspan="6">-- waiting --</tbody>
                        </table>
                    </div>
                </div>
                <div style="flex:1; min-width: 260px;">
                    <div class="stats-title" style="color:#f97316; margin-bottom:0.5rem;">📡 Data 02 · PER-STRAFE</div>
                    <div class="stats-table-wrapper">
                        <table class="stats-table" id="tableB">
                            <thead><tr><th>STRAFE</th><th>FRAMES</th><th>START</th><th>MAX</th><th>END</th><th>GAIN</th></tr></thead>
                            <tbody><tr><td colspan="6">-- no data --</tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer></footer>
</div>

<script>
    // ========== DEFAULT WR DATA (used to detect changes) ==========
    const DEFAULT_WR_DATA = `[Initial: 234.147]
Strafe 01: | 234.139 | 234.139 | 234.710 | 235.765 | 236.718 | 237.591 | 238.343 | 238.889 | 239.404 | 239.761 |
Strafe 02: | 240.212 | 241.313 | 242.149 | 243.182 | 244.046 | 244.650 | 244.997 | 245.198 | 245.171 |
Strafe 03: | 246.142 | 246.851 | 247.850 | 248.731 | 249.351 | 249.699 | 249.738 | 249.488 | 248.936 |
Strafe 04: | 250.080 | 251.475 | 252.317 | 253.099 | 253.536 | 253.570 | 253.346 | 252.868 | 252.379 |
Strafe 05: | 253.292 | 254.609 | 255.522 | 256.184 | 256.648 | 256.838 | 256.770 | 256.457 | 256.049 |
Strafe 06: | 256.986 | 257.699 | 258.226 | 258.672 | 258.936 | 258.944 | 258.805 | 258.801 |
Strafe 07: | 259.322 | 259.315 | 259.316 | 259.559 | 259.824 | 259.939 | 259.902 | 259.748 |
Strafe 08: | 260.095 | 260.092 | 260.090 | 260.080 | 260.217 | 260.297 | 260.336 | 260.353 | 260.361 | 260.353 | 260.354 |`;

    // ========== PRECISION TRUNCATION (STRING-BASED, NO ROUNDING) ==========
    function truncTo3Decimals(num) {
        if (num === null || isNaN(num)) return "?";
        let str = num.toString();
        if (str.includes('e')) {
            return (Math.floor(num * 1000) / 1000).toFixed(3);
        }
        let dotIndex = str.indexOf('.');
        if (dotIndex === -1) return str + ".000";
        let integerPart = str.substring(0, dotIndex);
        let decimalPart = str.substring(dotIndex + 1);
        if (decimalPart.length >= 3) {
            decimalPart = decimalPart.substring(0, 3);
        } else {
            decimalPart = decimalPart.padEnd(3, '0');
        }
        return integerPart + "." + decimalPart;
    }

    function truncNumber(num) {
        if (num === null || isNaN(num)) return 0;
        let truncatedStr = truncTo3Decimals(num);
        return parseFloat(truncatedStr);
    }

    function formatStrafeName(num) {
        return `Strafe ${num.toString().padStart(2, '0')}`;
    }

    // ========== PARSER ==========
    function parseKZData(text, dataId = "stream") {
        const lines = text.split(/\r?\n/);
        let metadata = { initial: null, maxSpeed: null, gain: null, w: null, ol: null, da: null };
        
        const initialRegex = /\[Initial:\s*([\d.]+)\]/;
        const maxRegex = /\[Max:\s*([\d.]+)\s*\(\+([\d.]+)\)/;
        const wRegex = /\[W:\s*(\d+)\]/;
        const olRegex = /\[OL:\s*(\d+)\]/;
        const daRegex = /\[DA:\s*(\d+)\]/;
        
        for (let i = 0; i < Math.min(lines.length, 10); i++) {
            const line = lines[i];
            if (!line.trim()) continue;
            if (!metadata.initial) { let m = line.match(initialRegex); if(m) metadata.initial = parseFloat(m[1]); }
            if (!metadata.maxSpeed) { let m = line.match(maxRegex); if(m) { metadata.maxSpeed = parseFloat(m[1]); metadata.gain = parseFloat(m[2]); } }
            if (metadata.w === null) { let m = line.match(wRegex); if(m) metadata.w = parseInt(m[1]); }
            if (metadata.ol === null) { let m = line.match(olRegex); if(m) metadata.ol = parseInt(m[1]); }
            if (metadata.da === null) { let m = line.match(daRegex); if(m) metadata.da = parseInt(m[1]); }
        }
        
        const rawStrafeList = [];
        let currentStrafe = null;
        const strafeHeaderRegex = /Strafe\s+(\d+)\s*:/i;
        
        for (let line of lines) {
            const trimmed = line.trim();
            if (trimmed === "") continue;
            const headerMatch = trimmed.match(strafeHeaderRegex);
            if (headerMatch) {
                if (currentStrafe && currentStrafe.data.length) rawStrafeList.push(currentStrafe);
                const strafeNum = parseInt(headerMatch[1]);
                currentStrafe = { name: formatStrafeName(strafeNum), data: [] };
                const afterColon = line.substring(headerMatch[0].length);
                const values = extractNumbersFromLine(afterColon);
                currentStrafe.data.push(...values);
            } else {
                if (currentStrafe) {
                    const values = extractNumbersFromLine(line);
                    currentStrafe.data.push(...values);
                }
            }
        }
        if (currentStrafe && currentStrafe.data.length) rawStrafeList.push(currentStrafe);
        
        if (rawStrafeList.length === 0) throw new Error(`[${dataId}] No valid Strafe data found.`);
        
        let initialVal = metadata.initial;
        if (initialVal === null && rawStrafeList.length > 0 && rawStrafeList[0].data.length > 0) {
            initialVal = rawStrafeList[0].data[0];
        }
        if (initialVal === null) throw new Error(`[${dataId}] No Initial value found. Add [Initial: xxx] at top.`);
        
        const strafeList = [];
        for (let i = 0; i < rawStrafeList.length; i++) {
            const s = rawStrafeList[i];
            if (i === 0) {
                strafeList.push({
                    name: s.name,
                    data: [initialVal, ...s.data],
                    originalFrameCount: s.data.length
                });
            } else {
                strafeList.push({
                    ...s,
                    originalFrameCount: s.data.length
                });
            }
        }
        
        const strafeMaxValues = [];
        for (let s of strafeList) {
            const maxVal = Math.max(...s.data);
            strafeMaxValues.push(maxVal);
        }
        
        for (let i = 0; i < strafeList.length; i++) {
            let gainVal;
            if (i === 0) {
                gainVal = strafeMaxValues[0] - initialVal;
            } else {
                gainVal = strafeMaxValues[i] - strafeMaxValues[i-1];
            }
            strafeList[i].gainDeltaMax = gainVal;
            strafeList[i].maxValue = strafeMaxValues[i];
        }
        
        let continuousData = [];
        let segments = [];
        for (let idx = 0; idx < strafeList.length; idx++) {
            const s = strafeList[idx];
            if (s.data.length === 0) continue;
            const startIdx = continuousData.length;
            continuousData.push(...s.data);
            const endIdx = continuousData.length - 1;
            segments.push({
                name: s.name,
                start: startIdx,
                end: endIdx,
                data: s.data.slice()
            });
        }
        
        const globalMax = Math.max(...continuousData);
        if (metadata.maxSpeed === null || metadata.maxSpeed < globalMax) metadata.maxSpeed = globalMax;
        if (metadata.gain === null && metadata.initial !== null) metadata.gain = metadata.maxSpeed - metadata.initial;
        
        const totalFrames = continuousData.length;
        
        return { metadata, strafes: strafeList, continuousData, segments, totalFrames };
    }
    
    function extractNumbersFromLine(line) {
        const parts = line.split('|');
        const values = [];
        for (let part of parts) {
            let cleaned = part.trim().replace(/Strafe\s+\d+\s*:/i, '').trim();
            if (cleaned === "") continue;
            let num = parseFloat(cleaned);
            if (!isNaN(num) && isFinite(num)) values.push(num);
        }
        return values;
    }
    
    function updateStatsAndTable(data, statsDivId, tableId, neonColor) {
        const statsDiv = document.getElementById(statsDivId);
        const tbody = document.querySelector(`#${tableId} tbody`);
        if (!data) {
            statsDiv.innerHTML = `<span>⚠️ No data</span>`;
            if (tbody) tbody.innerHTML = '<tr><td colspan="6">— no data —</tbody>';
            return;
        }
        const { metadata, strafes, totalFrames } = data;
        const initialTrunc = truncTo3Decimals(metadata.initial);
        const maxTrunc = truncTo3Decimals(metadata.maxSpeed);
        const gainTrunc = metadata.gain !== null ? truncTo3Decimals(metadata.gain) : '';
        const gainHtml = metadata.gain !== null ? ` (+${gainTrunc})` : '';
        statsDiv.innerHTML = `
            <span>🎯 Initial (part of Strafe 01): <strong style="color:#0ff">${initialTrunc}</strong></span>
            <span>⚡ Global MAX: <strong style="color:#ffb347">${maxTrunc}</strong>${gainHtml}</span>
            <span>📦 Strafe count: <strong>${strafes.length}</strong></span>
            <span>🎞️ Total frames (all): <strong>${totalFrames}</strong></span>
        `;
        let html = '';
        for (let s of strafes) {
            const arr = s.data;
            if (!arr.length) continue;
            const startVal = arr[0];
            const maxVal = s.maxValue;
            const endVal = arr[arr.length-1];
            const gainDelta = s.gainDeltaMax;
            const frameCount = s.originalFrameCount || arr.length;
            html += `<tr>
                <td><strong>${s.name}</strong></td>
                <td>${frameCount}</td>
                <td>${truncTo3Decimals(startVal)}</td>
                <td style="color:${neonColor}; font-weight:700;">${truncTo3Decimals(maxVal)}</td>
                <td>${truncTo3Decimals(endVal)}</td>
                <td style="color:${gainDelta>=0?'#3be87e':'#ff6b6b'}">${gainDelta>=0?'+':''}${truncTo3Decimals(gainDelta)}</td>
            </tr>`;
        }
        if (html === '') html = '<tr><td colspan="6">No valid segments</tbody>';
        if (tbody) tbody.innerHTML = html;
    }
    
    function getKeyPoints(continuousData, segments) {
        const points = new Map();
        if (continuousData.length > 0) points.set(0, continuousData[0]);
        for (let seg of segments) {
            let maxVal = -Infinity, maxIdx = seg.start;
            for (let i = seg.start; i <= seg.end; i++) {
                if (continuousData[i] > maxVal) { maxVal = continuousData[i]; maxIdx = i; }
            }
            if (isFinite(maxVal)) points.set(maxIdx, maxVal);
        }
        const lastIdx = continuousData.length - 1;
        if (lastIdx >= 0 && lastIdx !== 0) points.set(lastIdx, continuousData[lastIdx]);
        const sorted = Array.from(points.entries()).sort((a,b) => a[0] - b[0]);
        return sorted.map(([idx, val]) => [idx, val]);
    }
    
    function generateMaxMarkers(continuousData, segments, glowColor) {
        const points = [];
        for (let seg of segments) {
            let maxVal = -Infinity, maxIdx = seg.start;
            for (let i = seg.start; i <= seg.end; i++) {
                if (continuousData[i] > maxVal) { maxVal = continuousData[i]; maxIdx = i; }
            }
            if (isFinite(maxVal)) {
                const displayVal = truncTo3Decimals(maxVal);
                points.push({
                    name: `${seg.name} MAX`,
                    coord: [maxIdx, maxVal],
                    value: displayVal,
                    symbol: 'circle',
                    symbolSize: 12,
                    label: {
                        show: true,
                        formatter: `${displayVal}`,
                        position: 'top',
                        offset: [0, -10],
                        color: glowColor,
                        fontWeight: 'bold',
                        fontSize: 12,
                        backgroundColor: '#0a1222dd',
                        padding: [2, 6, 2, 6],
                        borderRadius: 8,
                        borderColor: glowColor,
                        borderWidth: 1,
                        fontFamily: 'monospace'
                    },
                    itemStyle: { color: glowColor, borderColor: '#000', borderWidth: 2, shadowBlur: 8, shadowColor: glowColor }
                });
            }
        }
        return points;
    }
    
    let currentChart = null;
    
    function renderComparison(dataA, dataB, isDataADefaultWR) {
        const dom = document.getElementById('compareChart');
        if (!dom) return;
        if (currentChart) currentChart.dispose();
        currentChart = echarts.init(dom);
        
        const keyPointsOnly = document.getElementById('keyPointsOnlyCheckbox').checked;
        const seriesList = [];
        
        // Data 01 series name logic
        const dataAName = isDataADefaultWR ? '260_lj_komi (WR)' : 'Data 01';
        
        if (dataA && dataA.continuousData?.length) {
            if (keyPointsOnly) {
                const keyPoints = getKeyPoints(dataA.continuousData, dataA.segments);
                const maxMarkers = generateMaxMarkers(dataA.continuousData, dataA.segments, '#3b82f6');
                seriesList.push({
                    name: dataAName,
                    type: 'line',
                    data: keyPoints,
                    smooth: false,
                    symbol: 'none',
                    lineStyle: { width: 2.5, color: '#3b82f6', shadowBlur: 12, shadowColor: '#3b82f6', type: 'solid' },
                    areaStyle: { opacity: 0.08, color: '#3b82f6' },
                    emphasis: { focus: 'series' },
                    tooltip: {
                        formatter: (params) => {
                            if (!params.data) return '';
                            const frameIdx = params.data[0];
                            const speed = params.data[1];
                            let label = '';
                            if (frameIdx === 0) label = 'Frame 0 (Strafe 01 start)';
                            else if (frameIdx === dataA.continuousData.length-1) label = 'Last Frame';
                            else label = 'MAX';
                            return `🔵 ${dataAName} | Frame ${frameIdx} | ${label}<br/>Predicted Distance: ${truncTo3Decimals(speed)} u`;
                        }
                    },
                    markPoint: { data: maxMarkers, symbolSize: 11, label: { show: true } }
                });
            } else {
                const maxMarkers = generateMaxMarkers(dataA.continuousData, dataA.segments, '#3b82f6');
                seriesList.push({
                    name: dataAName,
                    type: 'line',
                    data: dataA.continuousData,
                    smooth: false,
                    symbol: 'none',
                    lineStyle: { width: 2.5, color: '#3b82f6', shadowBlur: 12, shadowColor: '#3b82f6' },
                    areaStyle: { opacity: 0.08, color: '#3b82f6' },
                    emphasis: { focus: 'series' },
                    tooltip: {
                        formatter: (params) => {
                            if (!params[0]) return '';
                            let idx = params[0].dataIndex;
                            let spd = params[0].value;
                            let belong = '';
                            for (let s of dataA.segments) {
                                if (idx >= s.start && idx <= s.end) { belong = s.name; break; }
                            }
                            return `🔵 ${dataAName} | Frame ${idx} | ${belong}<br/>Predicted Distance: ${truncTo3Decimals(spd)} u`;
                        }
                    },
                    markPoint: { data: maxMarkers, symbolSize: 11, label: { show: true, formatter: (p) => p.value, fontSize: 12, fontWeight: 'bold' } }
                });
            }
        }
        
        if (dataB && dataB.continuousData?.length) {
            if (keyPointsOnly) {
                const keyPoints = getKeyPoints(dataB.continuousData, dataB.segments);
                const maxMarkers = generateMaxMarkers(dataB.continuousData, dataB.segments, '#f97316');
                seriesList.push({
                    name: 'Data 02',
                    type: 'line',
                    data: keyPoints,
                    smooth: false,
                    symbol: 'none',
                    lineStyle: { width: 2.5, color: '#f97316', shadowBlur: 12, shadowColor: '#f97316', type: 'solid' },
                    areaStyle: { opacity: 0.08, color: '#f97316' },
                    emphasis: { focus: 'series' },
                    tooltip: {
                        formatter: (params) => {
                            if (!params.data) return '';
                            const frameIdx = params.data[0];
                            const speed = params.data[1];
                            let label = '';
                            if (frameIdx === 0) label = 'Frame 0 (Strafe 01 start)';
                            else if (frameIdx === dataB.continuousData.length-1) label = 'Last Frame';
                            else label = 'MAX';
                            return `🟠 Data 02 | Frame ${frameIdx} | ${label}<br/>Predicted Distance: ${truncTo3Decimals(speed)} u`;
                        }
                    },
                    markPoint: { data: maxMarkers, symbolSize: 11, label: { show: true } }
                });
            } else {
                const maxMarkers = generateMaxMarkers(dataB.continuousData, dataB.segments, '#f97316');
                seriesList.push({
                    name: 'Data 02',
                    type: 'line',
                    data: dataB.continuousData,
                    smooth: false,
                    symbol: 'none',
                    lineStyle: { width: 2.5, color: '#f97316', shadowBlur: 12, shadowColor: '#f97316' },
                    areaStyle: { opacity: 0.08, color: '#f97316' },
                    emphasis: { focus: 'series' },
                    tooltip: {
                        formatter: (params) => {
                            if (!params[0]) return '';
                            let idx = params[0].dataIndex;
                            let spd = params[0].value;
                            let belong = '';
                            for (let s of dataB.segments) {
                                if (idx >= s.start && idx <= s.end) { belong = s.name; break; }
                            }
                            return `🟠 Data 02 | Frame ${idx} | ${belong}<br/>Predicted Distance: ${truncTo3Decimals(spd)} u`;
                        }
                    },
                    markPoint: { data: maxMarkers, symbolSize: 11, label: { show: true, formatter: (p) => p.value, fontSize: 12, fontWeight: 'bold' } }
                });
            }
        }
        
        if (!seriesList.length) {
            currentChart.setOption({ title: { show: true, text: 'Awaiting data input...', left: 'center', top: 'center', textStyle: { color: '#0ff' } } });
            return;
        }
        
        const legendData = seriesList.map(s => ({
            name: s.name,
            icon: 'circle',
            itemStyle: { color: s.lineStyle.color }
        }));
        
        let maxFrames = Math.max(dataA?.continuousData?.length || 0, dataB?.continuousData?.length || 0);
        const xAxisData = Array.from({ length: maxFrames }, (_, i) => i.toString());
        
        const option = {
            backgroundColor: '#03060c',
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: '#0ff1' } }, backgroundColor: '#0a122dd9', borderColor: '#0ff', borderWidth: 0.8, textStyle: { color: '#e0f2fe', fontSize: 11 } },
            legend: { 
                data: legendData,
                textStyle: { color: '#ccf4ff' }, 
                left: 'left', 
                top: 0, 
                backgroundColor: '#0a122daa', 
                borderRadius: 20, 
                padding: [4, 12],
                itemWidth: 16,
                itemHeight: 12,
                itemStyle: { borderWidth: 0 }
            },
            grid: { left: '6%', right: '5%', top: '14%', bottom: '12%', borderWidth: 0, containLabel: false },
            xAxis: {
                type: 'category', data: xAxisData, name: 'Frame', nameLocation: 'middle', nameGap: 35, nameTextStyle: { color: '#9ad7ff' },
                axisLabel: { color: '#9bc0e0', fontSize: 9, rotate: 0, interval: Math.ceil(maxFrames / 25) },
                axisLine: { lineStyle: { color: '#2e6a9e' } }, axisTick: { show: false }, splitLine: { show: false }
            },
            yAxis: {
                type: 'value', name: 'Predicted Distance (units)', nameLocation: 'middle', nameGap: 45, nameTextStyle: { color: '#9ad7ff' },
                axisLabel: { color: '#bbd9ff', fontSize: 10 }, splitLine: { lineStyle: { color: '#1e3a5f', type: 'dashed' } },
                axisLine: { show: false }, scale: true
            },
            series: seriesList,
            toolbox: {
                feature: { saveAsImage: { title: 'Capture Spectrum', theme: 'dark' }, dataZoom: { title: { zoom: 'Zoom', back: 'Reset' } }, restore: { title: 'Reset View' } },
                iconStyle: { borderColor: '#0ff' }, right: 20, top: 8, color: '#0ff'
            },
            dataZoom: [
                { type: 'slider', start: 0, end: 100, bottom: 12, height: 18, borderColor: '#0ff', fillerColor: '#0ff2', handleStyle: { color: '#0ff' } },
                { type: 'inside', start: 0, end: 100 }
            ],
            title: { show: true, text: keyPointsOnly ? 'KEY POINTS MODE (MAX only)' : 'FULL CURVE MODE (with MAX markers)', left: 'center', top: 6, textStyle: { color: '#0ff6', fontSize: 12, fontWeight: 'normal', fontFamily: 'monospace' } }
        };
        currentChart.setOption(option, true);
        window.addEventListener('resize', () => currentChart && currentChart.resize());
    }
    
    let parsedA = null, parsedB = null;
    
    function updateBoth() {
        const textA = document.getElementById('dataA').value;
        const textB = document.getElementById('dataB').value;
        const errDiv = document.getElementById('globalError');
        errDiv.style.display = 'none';
        let errMsg = '';
        try {
            parsedA = textA.trim() === "" ? null : parseKZData(textA, "A");
            updateStatsAndTable(parsedA, 'statsA', 'tableA', '#3b82f6');
        } catch(e) { parsedA = null; updateStatsAndTable(null, 'statsA', 'tableA', '#3b82f6'); errMsg += `[Data 01] ${e.message}<br>`; }
        try {
            parsedB = textB.trim() === "" ? null : parseKZData(textB, "B");
            updateStatsAndTable(parsedB, 'statsB', 'tableB', '#f97316');
        } catch(e) { parsedB = null; updateStatsAndTable(null, 'statsB', 'tableB', '#f97316'); errMsg += `[Data 02] ${e.message}<br>`; }
        if (errMsg) { errDiv.style.display = 'block'; errDiv.innerHTML = errMsg; }
        
        // Determine if Data 01 currently contains the default WR data
        const isDefaultWR = (textA.trim() === DEFAULT_WR_DATA);
        renderComparison(parsedA, parsedB, isDefaultWR);
    }
    
    function onCheckboxChange() {
        renderComparison(parsedA, parsedB, (document.getElementById('dataA').value.trim() === DEFAULT_WR_DATA));
    }
    
    function loadExampleA() {
        document.getElementById('dataA').value = DEFAULT_WR_DATA;
        updateBoth();
    }
    
    function loadExampleB() {
        document.getElementById('dataB').value = '';
        updateBoth();
    }
    
    function clearA() { document.getElementById('dataA').value = ''; updateBoth(); }
    function clearB() { document.getElementById('dataB').value = ''; updateBoth(); }
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('exampleA').addEventListener('click', loadExampleA);
        document.getElementById('exampleB').addEventListener('click', loadExampleB);
        document.getElementById('clearA').addEventListener('click', clearA);
        document.getElementById('clearB').addEventListener('click', clearB);
        document.getElementById('dataA').addEventListener('input', updateBoth);
        document.getElementById('dataB').addEventListener('input', updateBoth);
        document.getElementById('keyPointsOnlyCheckbox').addEventListener('change', onCheckboxChange);
        loadExampleA();
        document.getElementById('dataB').value = '';
        updateBoth();
    });
</script>
</body>
</html>
